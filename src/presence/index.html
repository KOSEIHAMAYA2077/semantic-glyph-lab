<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>文字のかたち — 表面の別版</title></head><body><main id="scene"></main><div id="start"><span>press enter</span></div><section id="entry" hidden><form id="form"><label for="text">&gt;</label><input id="text" aria-label="加える文章" autocomplete="off" spellcheck="false" placeholder="enter word [enter]"><button aria-label="送信">↵</button></form><p id="message" role="status"></p></section><nav id="actions" hidden aria-label="操作"><button id="input-open">▶ 入力</button><button id="shape-open">◇ 形</button><button id="help-open">? HELP</button><button id="pause">Ⅱ</button></nav><section id="panel" hidden aria-label="形と表示"><div class="row"><label for="shape">形</label><select id="shape"></select></div><div class="row"><label for="view">表示</label><select id="view"><option value="presence">文字の面</option><option value="texture">投影との比較</option><option value="advection">以前の面歩き</option></select></div><div class="row"><label for="size">文字</label><input id="size" type="range" min=".75" max="1.7" value="1.2" step=".05"></div><div class="row"><label for="motion">揺らぎ</label><input id="motion" type="range" min="0" max="1" value=".6" step=".1"></div><div class="row"><label for="speed">流れ</label><input id="speed" type="range" min="0" max="2" value=".75" step=".05"></div><p class="credit">生成済みじょうろ: Powered by Stability AI</p><button id="close-panel">閉じる</button></section><section id="help" hidden aria-label="操作と入力例"><p>Enter　入力 / Esc　閉じる<br>ドラッグ　回転 / ホイール　距離</p><p>文章の中の形・色・変形に反応します。</p><div id="examples"></div><p>色は、その入力の文字だけ。<br>指定しない文字は赤から白へ変わります。<br>入力した文字を繰り返して面を覆います。</p><p>この版は用意した24種類に反応します。<br>入力は保存・外部送信しません。</p><button id="close-help">閉じる</button></section><script type="module" src="./main.ts"></script></body></html>
