<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>面上の文字 — 移流比較</title>
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#000;color:#aaa;font:13px ui-monospace,monospace}#stage{position:absolute;inset:0}canvas{display:block}#controls{position:absolute;bottom:14px;left:14px;right:14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}button,select{background:#000;color:#bbb;border:1px solid #444;padding:7px 12px;font:inherit}button[aria-pressed=true]{border-color:#ddd;color:#fff}input{vertical-align:middle;width:90px}#stats{position:absolute;top:12px;left:16px;color:#777;white-space:pre;pointer-events:none;font-size:11px;line-height:1.5}#status{position:absolute;right:16px;top:14px;color:#999}#error{position:absolute;top:45%;width:100%;text-align:center;color:#d88}label{font-size:12px}</style></head><body>
<div id="stage"></div><div id="stats"></div><div id="status">準備中</div><div id="error" hidden></div>
<div id="controls"><button data-shape="sphere">球</button><button data-shape="vase">花瓶</button><button data-shape="generated">生成された花瓶</button><button data-shape="cube">角の比較</button><button id="pause">停止</button><label>文字サイズ <input id="size" type="range" min=".04" max=".17" step=".01" value=".09"></label><label><input id="mesh" type="checkbox" style="width:auto">面を見る</label><span>ドラッグで回転</span></div>
<script type="module" src="./preview.ts"></script></body></html>
